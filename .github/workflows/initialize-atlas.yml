name: Initialize atlas content
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write reviewed atlas files
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          encoded = (
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
              ''
          )
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'c66d9e6d03a932a6ea76e2c3ba5a110ab49aeb87cef10d5a9317ee8d3f802798'
          files = json.loads(raw)
          root = Path.cwd().resolve()
          for relative, content in files.items():
              path = (root / relative).resolve()
              assert path.is_relative_to(root) and ".git" not in path.relative_to(root).parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          print(f"Wrote {len(files)} reviewed files")
          PY
      - name: Validate reviewed files
        run: |
          python scripts/validate_catalog.py
          python scripts/build_catalog.py --check
          python -m compileall -q scripts examples
      - name: Commit catalog content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all -- . ':!.github/workflows/validate.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Add MARL Benchmark Atlas v0.1.0"
            git push origin HEAD:main
          fi
