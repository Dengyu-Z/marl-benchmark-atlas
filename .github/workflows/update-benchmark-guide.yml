name: Update benchmark guide
on:
  push:
    paths: ['.github/workflows/update-benchmark-guide.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply guide update
        run: |
          python - <<'PYCODE'
          import base64,zlib,json,pathlib,subprocess
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for p,s in files.items():
              assert not p.startswith('.') and '..' not in pathlib.PurePosixPath(p).parts
              f=pathlib.Path(p); f.parent.mkdir(parents=True,exist_ok=True); f.write_text(s)
          subprocess.run(['git','add','--',*files],check=True)
          PYCODE
      - run: python scripts/validate_catalog.py
      - run: python scripts/build_catalog.py --check
      - run: python -m compileall -q scripts examples
      - name: Commit guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Explain environments and algorithm compatibility'
          git push origin HEAD:main
