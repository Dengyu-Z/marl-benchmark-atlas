f"/><text x="28" y="322" font-size="19" fill="#183e50" font-weight="normal">DISCRETE: move or attack</text></g><g transform="translate(496,476)"><rect width="448" height="344" rx="18" fill="white" stroke="#cbdae0"/><text x="22" y="36" font-size="28" fill="#183e50" font-weight="700">MaBrax</text><text x="22" y="65" font-size="20" fill="#183e50" font-weight="normal">Share control of one robot</text><rect x="139" y="120" width="164" height="58" rx="16" fill="#bac9d1"/><path d="M157 173L116 220" fill="none" stroke="#2783bb" stroke-width="15" stroke-linecap="round"/><path d="M116 220L82 246" fill="none" stroke="#2783bb" stroke-width="12" stroke-linecap="round"/><path d="M282 173L316 219" fill="none" stroke="#7964ba" stroke-width="15" stroke-linecap="round"/><path d="M316 219L363 246" fill="none" stroke="#7964ba" stroke-width="12" stroke-linecap="round"/><circle cx="157" cy="173" r="12" fill="#153a50"/><circle cx="282" cy="173" r="12" fill="#153a50"/><text x="35" y="106" font-size="20" fill="#183e50" font-weight="normal">Agent 1</text><text x="308" y="106" font-size="20" fill="#183e50" font-weight="normal">Agent 2</text><text x="62" y="280" font-size="22" fill="#2783bb" font-weight="normal">[0.13, -0.47]</text><text x="268" y="280" font-size="22" fill="#7964ba" font-weight="normal">[-0.2, 0.6]</text><rect x="18" y="300" width="412" height="30" rx="10" fill="#e9e9fa"/><text x="28" y="322" font-size="19" fill="#183e50" font-weight="normal">CONTINUOUS: joint torques</text></g><g transform="translate(968,476)"><rect width="448" height="344" rx="18" fill="white" stroke="#cbdae0"/><text x="22" y="36" font-size="28" fill="#183e50" font-weight="700">MPE simple_spread</text><text x="22" y="65" font-size="20" fill="#183e50" font-weight="normal">Divide up the landmarks</text><path d="M70 220L110 117" fill="none" stroke="#b4c6ce" stroke-width="3" stroke-linecap="round"/><circle cx="110" cy="117" r="21" fill="#d2f3e5" stroke="#2baf84" stroke-width="4"/><circle cx="70" cy="220" r="19" fill="#2783bb"/><path d="M205 118L229 232" fill="none" stroke="#b4c6ce" stroke-width="3" stroke-linecap="round"/><circle cx="229" cy="232" r="21" fill="#d2f3e5" stroke="#2baf84" stroke-width="4"/><circle cx="205" cy="118" r="19" fill="#2783bb"/><path d="M345 191L349 106" fill="none" stroke="#b4c6ce" stroke-width="3" stroke-linecap="round"/><circle cx="349" cy="106" r="21" fill="#d2f3e5" stroke="#2baf84" stroke-width="4"/><circle cx="345" cy="191" r="19" fill="#2783bb"/><text x="85" y="279" font-size="19" fill="#183e50" font-weight="normal">Cover goals; avoid collisions</text><rect x="18" y="300" width="412" height="30" rx="10" fill="#e8f4ff"/><text x="28" y="322" font-size="19" fill="#183e50" font-weight="normal">DISCRETE or CONTINUOUS</text></g></g></svg>