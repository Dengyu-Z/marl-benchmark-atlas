<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Six MARL environments explained</title><desc id="desc">Conceptual sketches of warehouse delivery, cooperative foraging, path connection, combat, joint control and landmark coverage. These are not simulator renderings.</desc><rect width="1440" height="850" rx="20" fill="#edf4f6"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="48" font-size="30" font-weight="700" fill="#102c3b">What does one agent actually do?</text><text x="36" y="78" font-size="19" fill="#49616d">Conceptual sketches • Blue: agents / controllers • Green: goals • Orange: food • Red: opponents</text><g transform="translate(24,110)"><rect width="448" height="344" rx="18" fill="white" stroke="#cbdae0"/><text x="22" y="36" font-size="28" fill="#183e50" font-weight="700">RWARE</text><text x="22" y="65" font-size="20" fill="#183e50" font-weight="normal">Deliver a shelf</text><rect x="60" y="96" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="60" y="148" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="150" y="96" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="150" y="148" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="240" y="96" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="240" y="148" width="42" height="34" rx="4" fill="#a8bbc5"/><rect x="326" y="111" width="72" height="92" rx="9" fill="#d2f3e5"/><text x="333" y="163" font-size="18" fill="#183e50" font-weight="normal">GOAL</text><path d="M80 236L348 236" fill="none" stroke="#75b5d3" stroke-width="5" stroke-linecap="round"/><path d="M348 236L348 197" fill="none" stroke="#75b5d3" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="236" r="18" fill="#2783bb"/><circle cx="210" cy="236" r="18" fill="#2783bb"/><rect x="94" y="225" width="22" height="22" fill="#49616d"/><rect x="18" y="300" width="412" height="30" rx="10" fill="#e8f4ff"/><text x="28" y="322" font-size="19" fill="#183e50" font-weight="normal">DISCRETE: choose a command</text></g><g transform="translate(496,110)"><rect width="448" height="344" rx="18" fill="white" stroke="#cbdae0"/><text x="22" y="36" font-size="28" fill="#183e50" font-weight="700">LBF</text><text x="22" y="65" font-size="20" fill="#183e50" font-weight="normal">Collect food together</text><path d="M84 95L84 260" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M84 95L344 95" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M136 95L136 260" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M84 136L344 136" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M188 95L188 260" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M84 177L344 177" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M240 95L240 260" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M84 218L344 218" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M292 95L292 260" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><path d="M84 259L344 259" fill="none" stroke="#e5edf1" stroke-width="2" stroke-linecap="round"/><circle cx="166" cy="177" r="26" fill="#2783bb"/><circle cx="218" cy="218" r="26" fill="#2783bb"/><circle cx="218" cy="166" r="27" fill="#edab40"/><text x="158" y="186" font-size="27" fill="white" font-weight="normal">1</text><text x="210" y="227" font-size="27" fill="white" font-weight="normal">1</text><text x="210" y="175" font-size="27" fill="#4a341a" font-weight="normal">2</text><text x="273" y="183" font-size="20" fill="#183e50" font-weight="normal">LOAD</text><rect x="18" y="300" width="412" height="30" rx="10" fill="#e8f4ff"/><text x="28" y="322" font-size="19" fill="#183e50" font-weight="normal">DISCRETE: move or LOAD</text></g><g transform="translate(968,1