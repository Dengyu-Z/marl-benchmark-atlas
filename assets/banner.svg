    <rect x="264" y="352" width="190" height="36" rx="18" fill="#91caff" fill-opacity=".1" stroke="#91caff" stroke-opacity=".2"/>
    <text x="287" y="376" font-size="15" fill="#c5e4ff">ENGLISH + CHINESE</text>
    <text x="1260" y="210" text-anchor="middle" font-size="16" letter-spacing="2" fill="#8ce9d4">BENCHMARK</text>
    <text x="1260" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#f0fbfa">MaBrax</text>
