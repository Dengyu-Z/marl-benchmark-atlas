<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">MARL Benchmark Atlas</title>
  <desc id="desc">A guide to environments, paper protocols and reproducible starting points for multi-agent reinforcement learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d2b"/><stop offset="1" stop-color="#123b45"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8c7"/><stop offset="1" stop-color="#90cfff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8de3d0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1600" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1260" cy="215" r="176" stroke="#72dac7" stroke-opacity=".15" fill="none"/>
  <circle cx="1260" cy="215" r="120" stroke="#72dac7" stroke-opacity=".2" fill="none" stroke-dasharray="4 9"/>
  <circle cx="1260" cy="215" r="65" stroke="#72dac7" stroke-opacity=".2" fill="#103d48"/>
  <path d="M1137 83L1260 215L1416 135M1260 215L1433 304M1260 215L1156 355M1260 215L1080 235" stroke="url(#accent)" stroke-opacity=".45" fill="none" stroke-width="2"/>
  <g fill="#6ee7c7"><circle cx="1137" cy="83" r="7"/><circle cx="1416" cy="135" r="7"/><circle cx="1433" cy="304" r="7"/><circle cx="1156" cy="355" r="7"/><circle cx="1080" cy="235" r="7"/></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#a9d9d8" font-size="18" letter-spacing="2">
    <text x="1109" y="61">SMAX</text><text x="1434" y="140">MPE</text><text x="1402" y="339">RWARE</text><text x="1092" y="388">CONNECTOR</text><text x="996" y="241">LBF</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="86" font-size="17" font-weight="700" letter-spacing="5" fill="#74e5c8">MULTI-AGENT REINFORCEMENT LEARNING</text>
    <text x="72" y="174" font-size="74" font-weight="700" letter-spacing="-2" fill="#f0fbfa">MARL Benchmark</text>
    <text x="72" y="257" font-size="80" font-weight="700" letter-spacing="-2" fill="url(#accent)">Atlas</text>
    <text x="77" y="309" font-size="23" fill="#b9d4db">Choose an environment. Trace the protocol. Start reproducing.</text>
